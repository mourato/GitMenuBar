<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quota detail cards</title><style>:root{--foreground:#1d1d1f;--muted-foreground:#66666b;--muted:#e5e5e8;--background:#fff;--shadow-xs:0 1px 3px #0002}*{box-sizing:border-box}body{margin:0;padding:24px;background:#fff;font:13px -apple-system,BlinkMacSystemFont,sans-serif;color:#1d1d1f}h1{font-size:16px;margin:0 0 8px}.intro{font-size:12px;color:#66666b;margin:0 0 20px;max-width:800px}</style><h1>Quota detail cards</h1><p class="intro">Continuous meters. Tick = expected remaining; hatch = consumption above pace. Fictional readings.</p><style>
.qw{font:13px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;color:#1d1d1f}
.seg{display:inline-flex;background:var(--muted);border-radius:8px;padding:2px;margin-bottom:12px}
.seg button{border:0;background:none;color:var(--foreground);font:inherit;font-size:12px;padding:4px 12px;border-radius:6px;cursor:pointer}
.seg button.on{background:var(--background);box-shadow:var(--shadow-xs);font-weight:600}
.cols{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.cap{font-size:12px;color:var(--muted-foreground);margin:0 0 8px}
.pop{width:330px;background:#e9e9ec;border-radius:14px;padding:16px;box-sizing:border-box}
.ph{display:flex;justify-content:space-between;font-size:11px;color:#77777c;padding:0 4px 8px}
.card{background:#f7f7f8;border-radius:10px;padding:10px 12px;margin-bottom:8px}
.card:last-child{margin-bottom:0}
.ch{display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:6px}
.chip{font-size:10.5px;font-weight:500;color:#66666b;background:#e4e4e7;border-radius:999px;padding:1px 7px}
.r{display:grid;grid-template-columns:104px 1fr 40px;align-items:center;gap:10px;height:24px}
.lb{white-space:nowrap;font-size:12px}.lb span{color:#8a8a8e;font-size:11px;margin-left:4px}
.val{text-align:right;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.warn .val{color:#d9730a}
.bar{position:relative;height:5px;border-radius:3px;background:#dcdce0}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#55555a}
.bar u{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,#f0820f 0 2px,transparent 2px 4px);opacity:.55}
.bar b{position:absolute;top:-3px;width:2px;height:11px;margin-left:-1px;background:#1d1d1f;border-radius:1px;box-shadow:0 0 0 1.5px #f7f7f8}
.warn .bar i{background:#f0820f}
.sg{display:flex;gap:3px;justify-content:flex-end}.sg s{width:14px;height:5px;border-radius:2px;background:#dcdce0}
.sg s.f{background:#55555a}.warn .sg s.f{background:#f0820f}
.ring{justify-self:end;width:16px;height:16px;border-radius:50%;-webkit-mask:radial-gradient(circle,transparent 4.5px,#000 5px);mask:radial-gradient(circle,transparent 4.5px,#000 5px)}
.cost{display:flex;justify-content:space-between;align-items:center;height:24px;font-size:12px}
.cost b{font-size:14px;font-variant-numeric:tabular-nums}
.leg{font-size:11px;color:#77777c;padding:8px 4px 0;display:flex;gap:12px;align-items:center}
.leg .bar{width:26px;display:inline-block;vertical-align:middle;margin-right:5px}
.mbar{background:#2a2a2d;border-radius:10px;padding:16px;display:flex;gap:14px;color:#f2f2f2;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;width:fit-content}
.mi{display:flex;align-items:center;gap:6px}
.stack{display:flex;flex-direction:column;gap:3px}
.mbar .bar{width:26px;height:3px;background:#5a5a5f}.mbar .bar i{background:#f2f2f2}
.mbar .bar b{height:7px;top:-2px;width:1.5px;background:#fff;box-shadow:0 0 0 1px #2a2a2d}
.mbar .warn .bar i,.mbar .wt{background:#ff9f2e}.mbar .wt{background:none;color:#ff9f2e}
.mbar .sg s{width:5px;height:4px;background:#5a5a5f}.mbar .sg s.f{background:#f2f2f2}.mbar .warn .sg s.f{background:#ff9f2e}
.mbar .ring{width:13px;height:13px;-webkit-mask:radial-gradient(circle,transparent 3.5px,#000 4px);mask:radial-gradient(circle,transparent 3.5px,#000 4px)}
</style>
<div class="qw">
<div class="seg" id="seg"><button data-s="line" class="on">Line + pace</button><button data-s="bars">Bars</button><button data-s="ring">Circular</button><button data-s="text">Text</button></div>
<div class="cols">
  <div><p class="cap">Popover</p><div class="pop" id="pop"></div></div>
  <div><p class="cap">Item da menu bar</p><div class="mbar" id="mb"></div></div>
</div>
</div>
<script>
// [label, reset, % left, pace position (% left expected), warn]
const D=[
["Antigravity","#2f6fed","▲",null,[["5-hour","4h 59m",100,null],["Weekly","2d 19h",61,40]]],
["Claude Code","#d97757","✳",null,[["5-hour","2h 42m",76,54],["Weekly","4d 11h",22,64,1],["Model only","4d 11h",76,64]]],
["Codex","#6b5cf6","֎","Plus · 1 reset",[["5-hour","28m",56,9],["Weekly","6d 19h",93,97]]],
["OpenCode Go","#2f6fed","▮",null,[["5-hour","4h",100,80],["Weekly","2d 9h",34,34,1],["30-day","26d 2h",67,87]]]];
const meter=(s,l,p,w,dark)=>{
  const c=w?(dark?"#ff9f2e":"#f0820f"):(dark?"#f2f2f2":"#55555a"),t=dark?"#5a5a5f":"#dcdce0";
  if(s=="line")return `<div class="bar"><i style="width:${l}%"></i>${p!=null&&p>l?`<u style="left:${l}%;width:${p-l}%"></u>`:""}${p!=null?`<b style="left:${p}%"></b>`:""}</div>`;
  if(s=="bars")return `<div class="sg">${[0,1,2,3,4].map(i=>`<s class="${i<Math.round(l/20)?"f":""}"></s>`).join("")}</div>`;
  if(s=="ring")return `<div class="ring" style="background:conic-gradient(${c} ${l}%,${t} 0)"></div>`;
  return "";
};
function draw(s){
  const menuStyle=s;s="line";pop.innerHTML=`<div class="ph"><span>AI Usage Quotas</span><span>% remaining · updated 2m ago</span></div>`+D.map(d=>`<div class="card"><div class="ch"><span style="color:${d[1]}">${d[2]}</span>${d[0]}${d[3]?`<span class="chip">${d[3]}</span>`:""}</div>`+
    d[4].map(r=>`<div class="r${r[4]?" warn":""}" style="${s=="line"?"":"grid-template-columns:1fr 80px 40px"}"><div class="lb">${r[0]}<span>↻ ${r[1]}</span></div>${meter(s,r[2],r[3],r[4])||"<span></span>"}<div class="val">${r[2]}%</div></div>`).join("")+`</div>`).join("")+
    `<div class="card"><div class="ch">API spend<span class="chip">Nov</span></div><div class="cost"><span><span style="color:#6b5cf6">֎</span> OpenAI</span><b>$12.40</b></div><div class="cost"><span><span style="color:#d97757">✳</span> Anthropic</span><b>$28.60</b></div></div>`+
    (s=="line"?`<div class="leg"><span><span class="bar"><i style="width:60%"></i><b style="left:40%"></b></span>marca = ritmo esperado</span><span><span class="bar"><i style="width:30%"></i><u style="left:30%;width:40%"></u><b style="left:70%"></b></span>atrás do ritmo</span></div>`:"");
  s=menuStyle;mb.innerHTML=D.slice(1,3).map(d=>{const a=d[4][0],b=d[4][1];
    const body=s=="text"?`<span>${a[2]}%</span><span class="${b[4]?"wt":""}">${b[2]}%</span>`:
      s=="line"?`<div class="stack">${[a,b].map(r=>`<div class="${r[4]?"warn":""}">${meter(s,r[2],r[3],r[4],1)}</div>`).join("")}</div>`:
      [a,b].map(r=>`<div class="${r[4]?"warn":""}">${meter(s,r[2],r[3],r[4],1)}</div>`).join("");
    return `<div class="mi"><span style="color:${d[1]}">${d[2]}</span>${body}</div>`}).join("");
}
seg.onclick=e=>{const s=e.target.dataset.s;if(!s)return;[...seg.children].forEach(b=>b.classList.toggle("on",b==e.target));draw(s)};
draw("line");
</script>
<style>.seg,.cols>div:nth-child(2),.cols .cap{display:none}.pop{width:360px}.r{grid-template-columns:114px 1fr 40px}.ch{font-size:13px}.val{font-size:13px}</style><style>.intro{width:100%;white-space:normal;overflow-wrap:anywhere}</style></html>
