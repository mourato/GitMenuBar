included:
  - GitMenuBar
  - GitMenuBarTests

excluded:
  - build
  - .xcode-build
  - .xcode-build-tests
  - dist

disabled_rules:
  - line_length
  - opening_brace
  - type_body_length
  - function_body_length

opt_in_rules:
  - async_without_await
  - force_unwrapping
  - private_over_fileprivate
  - trailing_comma

file_length:
  warning: 500
  error: 600

identifier_name:
  min_length: 2

reporter: "xcode"
