included:
  - GitMenuBar
  - GitMenuBarTests

excluded:
  - build
  - .xcode-build
  - .xcode-build-tests
  - dist

disabled_rules:
  - line_length
  - opening_brace
  - type_body_length
  - function_body_length

opt_in_rules:
  - async_without_await
  - force_unwrapping
  - private_over_fileprivate
  - trailing_comma
  # Swift moderno (maioria autocorrigível via `swiftlint lint --fix`)
  - shorthand_optional_binding
  - prefer_key_path
  - direct_return
  - implicit_return
  - redundant_nil_coalescing
  - toggle_bool
  - joined_default_parameter
  # Performance: derivados baratos de filter/count/empty
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - first_where
  - last_where
  - sorted_first_last
  - empty_count
  - empty_string
  # Higiene
  # (unused_import omitido: só roda via `swiftlint analyze`, que o lane não executa;
  # adicioná-lo ao `lint` seria config morta com warning enganoso.)
  # Acessibilidade (twostraws/swiftui-agent-skill)
  - accessibility_label_for_image
  - accessibility_trait_for_button

# NÃO ativadas de propósito (documentado):
# - private_swiftui_state: MainMenuView expõe @State para extensions em outros
#   arquivos; exigir `private` quebra compilação. Reativar após fatiar a view.
# - one_declaration_per_file: Models/* e paletas coesas agrupam tipos por
#   domínio; fatiar tudo geraria ~40 arquivos sem ganho de leitura.
# - no_magic_numbers: WorkbenchMetrics *é* o arquivo de tokens; a regra
#   inundaria métricas/paletas legítimas.

file_length:
  warning: 500
  error: 600

identifier_name:
  min_length: 2

custom_rules:
  swiftui_foreground_style:
    name: "SwiftUI: use foregroundStyle over foregroundColor"
    regex: '\.foregroundColor\('
    message: "Use foregroundStyle() instead of foregroundColor()"
    severity: error
  swiftui_corner_radius:
    name: "SwiftUI: use clipShape over cornerRadius"
    regex: '\.cornerRadius\('
    message: "Use clipShape(.rect(cornerRadius:)) instead of cornerRadius()"
    severity: error
  swiftui_font_weight:
    name: "SwiftUI: use bold() over fontWeight(.bold)"
    regex: '\.fontWeight\('
    message: "Use bold() instead of fontWeight(.bold); avoid scattered medium/semibold"
    severity: error
  swiftui_legacy_alert:
    name: "SwiftUI: modern .alert over Alert struct"
    regex: '\bAlert\('
    message: "Use the modern .alert variant with Button instead of the Alert struct"
    severity: error
  swiftui_no_gcd:
    name: "Concurrency: Task/@MainActor over DispatchQueue"
    regex: 'DispatchQueue\.(main|global)\.async'
    message: "Use Task/@MainActor instead of DispatchQueue.main/global.async"
    severity: error
  swiftui_no_sleep_nanoseconds:
    name: "Concurrency: Task.sleep(for:) over nanoseconds"
    regex: 'Task\.sleep\(nanoseconds:'
    message: "Use Task.sleep(for:) instead of Task.sleep(nanoseconds:)"
    severity: error
  swiftui_search_contains:
    name: "Swift: localizedStandardContains for user-input filtering"
    regex: 'localizedCaseInsensitiveContains|\.lowercased\(\)\.contains'
    message: "Use localizedStandardContains() when filtering text from user input"
    severity: error
    # A regra mira superfícies de busca com entrada do usuário. Correspondência
    # programática (chaves de API, stderr do git, asserts de teste) está fora
    # do escopo — mudar semântica ali seria churn gratuito.
    excluded:
      - GitMenuBarTests
      - GitMenuBar/Services/UsageQuota/ClaudeCodeUsageProvider.swift
      - GitMenuBar/Services/UsageQuota/GeminiUsageParsing.swift
      - GitMenuBar/Models/ProjectStatusModels.swift
  swiftui_onchange_params:
    name: "SwiftUI: onChange needs 0- or 2-parameter variant"
    regex: '\.onChange\(of:[^)]+\)\s*\{\s*[A-Za-z_][A-Za-z0-9_]*\s+in'
    message: "Use the onChange variant with two parameters (old, new) or none"
    severity: error
  swiftui_geometry_reader:
    name: "SwiftUI: modern alternatives over GeometryReader"
    regex: 'GeometryReader|UIScreen\.main\.bounds'
    message: "Prefer containerRelativeFrame(), visualEffect() or Layout over GeometryReader"
    severity: error
  # Lucide catalog gate (mourato/GitMenuBar#23). New interface icons must go
  # through LucideIconName + LucideIconView / Label(lucide:) / NSImage(lucide:).
  # `make lint` also runs this rule via scripts/lint.sh (--only-rules), since
  # the shared skill config is third-party and stays unchanged.
  lucide_no_system_image:
    name: "Icons: Lucide catalog over SF Symbols"
    regex: 'system(Name|Image|SymbolName)\s*:'
    message: "Use LucideIconName with LucideIconView / Label(lucide:) / NSImage(lucide:) instead of SF Symbols (see docs/lucide-icons.md)"
    severity: error
    excluded:
      # The single sanctioned fallback inside the wrapper.
      - GitMenuBar/Components/Common/LucideIconView.swift
      # Legacy SF Symbol call sites, grandfathered. Migrate them in #24-#26;
      # do NOT add new files here — new uses fail the lint.
      - GitMenuBar/App/AppSettingsWindowController.swift
      - GitMenuBar/App/MainWindowToolbarController.swift
